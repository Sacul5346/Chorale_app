# Fabrique l'APK signé de l'application sur les serveurs de GitHub.
# Lancement : onglet « Actions » du dépôt > « Fabriquer l'APK » > « Run workflow ».
# L'APK est publié dans une « Release » : lien direct, sans compte GitHub, qui
# pointe toujours vers la dernière version :
#   https://github.com/Sacul5346/Chorale_app/releases/latest/download/chorale.apk
# Pour une nouvelle version, augmenter `version:` dans pubspec.yaml avant de lancer
# (relancer avec le même numéro remplace simplement l'APK de cette version).
#
# Secrets nécessaires (Settings > Secrets and variables > Actions) :
#   KEYSTORE_BASE64   : la clé chorale-release.p12 encodée en base64
#   KEYSTORE_PASSWORD : son mot de passe
#   DRIVE_API_KEY     : (facultatif) clé API Google limitée à « Google Drive API »
name: Fabriquer l'APK

on:
  workflow_dispatch:

# Nécessaire pour créer la Release et y déposer l'APK.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04  # version fixe : pas de surprise au passage à Ubuntu 26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      # Sans la vraie clé, les téléphones refuseraient la mise à jour :
      # on arrête plutôt que de fabriquer un APK signé avec une clé de test.
      - name: Installer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD manquants."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/chorale-release.p12
          cat > android/key.properties <<EOF
          storeFile=chorale-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          EOF
          keytool -list -keystore android/app/chorale-release.p12 \
            -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" | grep -i upload

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Clé API Google Drive (association automatique des playbacks).
      # Facultative : sans elle, l'app fonctionne mais cette fonction
      # affiche « clé non configurée ».
      - name: Fabriquer l'APK
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: flutter build apk --release --dart-define=DRIVE_API_KEY="$DRIVE_API_KEY"

      - name: Nommer l'APK avec sa version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mv build/app/outputs/flutter-apk/app-release.apk "chorale-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "chorale-$VERSION.apk" chorale.apk
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "chorale-$VERSION.apk" chorale.apk --clobber
          else
            gh release create "$TAG" "chorale-$VERSION.apk" chorale.apk \
              --target "$GITHUB_SHA" \
              --title "Chorale $VERSION" \
              --notes "Télécharger : chorale.apk (ci-dessous), puis l'installer sur le téléphone."
          fi
          echo "Lien direct : https://github.com/$GITHUB_REPOSITORY/releases/latest/download/chorale.apk" >> "$GITHUB_STEP_SUMMARY"
